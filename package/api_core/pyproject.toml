[project]
name = "dqh-api-core"
version = "0.1.0"
description = "Reusable FastAPI layer: app factory, response envelope, error handling, ASGI middleware, SSE streaming, health checks."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dqh"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "pyproject.toml"]
