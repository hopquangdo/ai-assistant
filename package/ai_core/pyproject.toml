[project]
name = "dqh-ai-core"
version = "0.1.0"
description = "Reusable LLM/agent core on the LangChain ecosystem: model factory, ReAct runtime, tool execution, usage tracking."
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3.29",
    "langchain>=0.3.14",
    "langgraph>=0.2.60",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.3.7"]
openai = ["langchain-openai>=0.2.14"]
mcp = ["langchain-mcp-adapters>=0.3"]
# RedisConversationStore — client redis.asyncio do app tiêm vào.
redis = ["redis>=4.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dqh"]

[tool.hatch.build.targets.wheel.force-include]
"data/model_prices.json" = "dqh/ai_core/data/model_prices.json"

[tool.hatch.build.targets.sdist]
include = ["src", "data", "tests", "pyproject.toml"]
